name: publish

on:
  push:
    # Final SemVer tags only (e.g. v1.9.0, v1.9.1). Excludes ALL pre-release
    # suffixes (v1.9.0-rc1, v1.9.0-RC1, v1.9.0-beta, ...).
    # GitHub Actions evaluates tags in order: a matching negative pattern after
    # a positive match excludes the ref (docs: workflow-syntax on.push.tags).
    tags: ['v*.*.*', '!v*.*.*-*']

permissions:
  contents: read

# Trusted-Publisher-Binding: PyPI-TP-Eintrag muss auf DIESEN Workflow-Namen + environment zeigen.
# NACH dem Split: TestPyPI-TP auf `publish-testpypi.yml` + `testpypi` umkonfigurieren (Maintainer one-time setup).
# Prod-TP bleibt `publish.yml` + `pypi`.

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned: actions/checkout v4 -> 11d5960a326750d5838078e36cf38b85af677262 (2026-09-04)
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # pinned: actions/setup-python v5 -> a26af69be951a213d495a4c3e4e4022e16d87065 (2026-09-04)
        with:
          python-version: "3.11"
      - name: Build sdist + wheel
        run: |
          pip install build
          python -m build --outdir dist .
      - name: Check dist
        run: |
          pip install twine
          twine check --strict dist/*
          ls -lh dist/
          python -m pip install --dry-run dist/*.whl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # pinned: actions/upload-artifact v4 -> ea165f8d65b6e75b540449e92b4886f43607fa02 (2026-09-04)
        with:
          name: dist
          path: dist/

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    # Defense-in-depth: prod publish only for final SemVer tags (no pre-release suffix).
    if: ${{ !contains(github.ref, '-') }}
    environment:
      name: pypi
      url: https://pypi.org/project/astra-pipeline/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # pinned: actions/download-artifact v4 -> d3f86a106a0bac45b974a628896c90dbdf5c8093 (2026-09-04)
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI (OIDC trusted publisher)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # pinned: pypa/gh-action-pypi-publish release/v1 -> dc37677b2e1c63e2034f94d8a5b11f265b73ba33 (2026-09-04)
        with:
          verbose: true
          repository-url: https://upload.pypi.org/legacy/
