name: publish-testpypi

on:
  push:
    # Pre-release RC tags only (case-sensitive glob; use lower-case -rc*).
    tags: ['v*.*.*-rc*']

permissions:
  id-token: write
  contents: read

# Trusted-Publisher-Binding: PyPI-TP-Eintrag muss auf DIESEN Workflow-Namen + environment zeigen.
# NACH dem Split: TestPyPI-TP auf `publish-testpypi.yml` + `testpypi` umkonfigurieren (Maintainer one-time setup).
# Prod-TP bleibt `publish.yml` + `pypi`.

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build sdist + wheel
        run: |
          pip install build
          python -m build --outdir dist .
      - name: Check dist
        run: |
          ls -lh dist/
          python -m pip install --dry-run dist/*.whl || true
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/astra-pipeline
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to TestPyPI (OIDC trusted publisher)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: true
          repository-url: https://test.pypi.org/legacy/
