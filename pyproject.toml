# V1.12-FU-1 (2026-09-08): Version precedence SSOT and entry-point parity (pyproject.toml).
# SSOT is pyproject.toml [project] version here (hatchling, not dynamic). Runtime exposes
# the same string via two equal-precedence paths:
#   - import astro_process; astro_process.__version__  (src/astro_process/__init__.py)
#   - astra --version / python -m astro_process --version (src/astro_process/cli.py)
# Both read installed distribution metadata via importlib.metadata (astra-pipeline
# -> astra fallback -> 0.0.0+dev when running from source without install).
# CHANGELOG.md is derived from this version (curated per release); git tag
# v<version> is created FROM this pyproject version at publish time (never reverse).
# Canonical entry-point is the `astra` console script (alias astro-process);
# `python -m astro_process` (src/astro_process/__main__.py) is byte-identical
# parity. `python -m astra` is NOT supported (packages = ["src/astro_process"]).
# Detail: src/astro_process/__init__.py docstring + release-process.md Phase 5.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "astra-pipeline"
version = "1.12.0"
description = "Agentic Astrophotography Processing Pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Boris Frast", email = "borisfrast@gmail.com"}
]
keywords = ["astrophotography", "astronomy", "fits", "pipeline", "agentic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Astronomy",
]
urls = {Homepage = "https://github.com/borisfrast-oss/astra", Repository = "https://github.com/borisfrast-oss/astra", Issues = "https://github.com/borisfrast-oss/astra/issues", Changelog = "https://github.com/borisfrast-oss/astra/blob/main/CHANGELOG.md"}

dependencies = [
    "astropy>=6.0",
    "numpy>=2.0",
    "scipy>=1.12",
    "colour-demosaicing>=0.2.7",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "jinja2>=3.1",
    "structlog>=24.0",
    "pyyaml>=6.0",
    # click 8.5 changes Flag-default rendering (Sentinel); pin keeps fresh
    # installs deterministic and the CI docs-check consistent.
    "click>=8.1,<8.5",
    "rich>=13.0",
    "prompt-toolkit>=3.0",
    "python-dotenv>=1.0",
    # DEF-008 (Boris-Entscheid 2026-09-02): astroquery ist Base-Dependency,
    # damit PCC (GAIA/VizieR/APASS) out-of-the-box verfuegbar ist.
    "astroquery>=0.4",
    # V1.12-PREVIEW-FORMAT (AC-PREVIEW-FMT-2): tifffile fuer 16-bit TIFF Previews
    # Pillow kann uint16 RGB nicht direkt speichern (fromarray (H,W,3) uint16 -> TypeError)
    "tifffile>=2023.0",
    # sep (Source Extractor Python) is a hard base dependency: used in GAIA-PCC star
    # detection (_find_sources) and is not optional -- without it PCC always falls back
    # to gray_world and ghosting detection is skipped. Moved from astroalign extra to
    # base so that 'pip install astra-pipeline' works out of the box. (backy, 2026-09-19)
    "sep>=1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.12",
    "ruff>=0.4",
    "mypy>=1.10",
    "yamllint>=1.35",
    # Full test-suite environment (CI-equivalent). Mirrors the astroalign extra
    # so that `pip install -e .[dev]` runs every test without optional-dependency
    # skips. astroquery ist seit DEF-008 Base-Dependency und muss hier nicht
    # mehr wiederholt werden.
    "astroalign>=2.6,<3",
    "scikit-image>=0.24",
    "scikit-learn>=1.1",
    "sep>=1.4",
]
graxpert = ["graxpert>=3.2"]
astro = ["astrometry-net>=0.97"]
# W9-A (AC-W9-A1, ADR-021): optional astroalign extra.
# sep is now a base dependency (moved from here, backy 2026-09-19) -- it is a hard
# runtime requirement for GAIA-PCC star detection. scikit-image is a lazy/optional
# dependency loaded by astroalign when used. scikit-learn ist ebenfalls lazy.
astroalign = ["astroalign>=2.6,<3", "scikit-image>=0.24", "scikit-learn>=1.1"]

[project.scripts]
astra = "astro_process.cli:cli"
astro-process = "astro_process.cli:cli"
# FU-1 parity: `python -m astro_process` (src/astro_process/__main__.py) forwards
# to the same cli:cli â€” equal precedence to the `astra` console script.
# `python -m astra` is not supported (no top-level package `astra`).

# F-SE-1.2 (v12-structure-enhancement.md, SE-B): erstes Produktiv-Plugin
# in v1.2 (OQ-PL-3-Amendment 2026-08-05). Entry-Point-Gruppe "astra.plugins"
# ist verbindlich (OQ-PL-2, v12-plugin-interface.md).
[project.entry-points."astra.plugins"]
structure-enhancement = "astro_process.plugins.structure_enhancement:StructureEnhancementPlugin"

[tool.hatch.build.targets.wheel]
packages = ["src/astro_process"]

[tool.hatch.build.targets.wheel.force-include]
"data/target-cache.json" = "astro_process/data/target-cache.json"
"data/examples" = "astro_process/data/examples"
"README.md" = "astro_process/README.md"
"docs" = "astro_process/docs"
"handbook" = "astro_process/handbook"

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "PIE", "T20", "PT", "PTH", "ERA", "SIM", "TID", "ARG", "LOG"]
ignore = ["S101", "ARG001", "ARG002"]
exclude = ["tests/fixtures/**", "test-data/**"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
strict = true
namespace_packages = true
exclude = ["tests/**", "test-data/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "slow: Slow tests",
]

# Astra project tooling metadata.
# Pre-Release process: run `make docs && make check-docs` (or the equivalent
# `python scripts/generate_docs.py all && python scripts/generate_docs.py check`)
# before bumping the version or creating a release.
[tool.astra]
pre_release_steps = [
    "python scripts/generate_docs.py all",
    "python scripts/generate_docs.py check",
]

[tool.coverage.run]
source = ["src/astro_process"]
omit = ["tests/**", "test-data/**"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
