# Astra Pipeline Configuration — Example with Env Placeholders
# Kopieren: cp config.example.yaml config.yaml  oder via `astra init --non-interactive`
# Alle Pfade nutzen ${VAR:-default} — nach load_config() aufgeloest (kein ${} im AppConfig)
# .env gewinnt nicht ueber Shell-Env (dotenv override=False), CWD .env > pipeline_root .env

data_root: "${ASTRA_DATA_ROOT:-C:/Astra}"
working_dir: "./working"
output_dir: "./output"
config_dir: "./config"

gimp_path: "${GIMP_PATH:-gimp}"

default_preset: "star_standard"
cpu_threads: 0
gpu_acceleration: true
keep_working: false

quality_accept_threshold: 80
quality_review_threshold: 60

# Darks Library (optional)
darks_repository: "${ASTRA_DARKS_ROOT:-C:/Astra/_darks}"

# Home-Trap Beispiel: ${HOME}/Astra laeuft auf Win/Linux
# data_root: "${HOME}/Astra"

registration:
  method: "fft"
  max_control_points: null
  max_rotation_deg: 2.0
  max_scale_dev: 0.02
  stack_scale_factor: 2.0

cfa_drizzle:
  enabled: false
  scale: 2.0
  pixfrac_mode: "auto"
  pixfrac: 0.5
  kernel: "lanczos3"
  quality_gate:
    mode: "auto"
    rejection_enabled: true
    thresholds:
      fwhm: [1.5, 5.0]
      snr: [10, null]
      star_count: [20, null]
      correlation: [0.3, null]
    elongation_unusable: true
    min_stars_cfa: 3
  min_frames: 5
  fallback: "malvar"

# pcc: optional (null = Preset gewinnt, CLI gewinnt immer)
# pcc:
#   enabled: null
#   quality_gate:
#     enabled: true
#     min_factor: 0.5
#     max_factor: 2.0

equipment_profiles:
  - name: "default"
    telescope: "Unknown"
    aperture_mm: 0
    focal_length_mm: 0
    camera: "Unknown"
    pixel_size_um: 3.76
    gain: 100
    offset: 50
    default_temp_c: -10.0

  - name: "dwarf_mini"
    telescope: "Dwarf Mini"
    aperture_mm: 0
    focal_length_mm: 150
    camera: "Dwarf Mini"
    pixel_size_um: 2.9
    gain: 60
    offset: 10
    default_temp_c: 27.0
    mount_type: "az"
    preferred_registration: "astroalign"
    max_rotation_deg: 15
    max_exptime_fft_warn: 45

  - name: "dwarf3"
    deprecated: true
    alias_for: "dwarf_mini"

pipeline_presets:
  - name: "galaxy_standard"
    target_types: ["galaxy"]
    steps:
      - name: create_master_dark
      - name: calibrate_lights
      - name: register_frames
      - name: stack_frames
      - name: background_extraction
      - name: photometric_color_calibration
      - name: scnr
      - name: stretch
      - name: export
  - name: "nebula_standard"
    target_types: ["nebula"]
    steps:
      - name: create_master_dark
      - name: calibrate_lights
      - name: register_frames
      - name: stack_frames
      - name: gradient_removal
      - name: background_extraction
      - name: structure_enhancement
      - name: stretch
      - name: export
  - name: "star_standard"
    target_types: ["star"]
    steps:
      - name: create_master_dark
      - name: calibrate_lights
      - name: register_frames
      - name: stack_frames
      - name: natural_color_processing
      - name: scnr
      - name: stretch
      - name: export
